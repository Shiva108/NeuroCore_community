<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">NeuroCore consensus reporting demo</title>
  <desc id="desc">A terminal-style screenshot showing a consensus report with overview, findings, risks, and recommended actions.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect x="86" y="68" width="1108" height="584" rx="22" fill="#111827" stroke="#475569" stroke-width="2"/>
  <circle cx="136" cy="110" r="10" fill="#ef4444"/>
  <circle cx="166" cy="110" r="10" fill="#f59e0b"/>
  <circle cx="196" cy="110" r="10" fill="#22c55e"/>
  <text x="236" y="118" fill="#cbd5e1" font-family="monospace" font-size="24">neurocore-community / reporting shell</text>
  <text x="126" y="180" fill="#93c5fd" font-family="monospace" font-size="26">$ neurocore report consensus --request-json '{...}'</text>
  <text x="126" y="238" fill="#f8fafc" font-family="monospace" font-size="30">## Overview</text>
  <text x="126" y="280" fill="#cbd5e1" font-family="monospace" font-size="24">Shared evidence indicates the request is well-supported by recent capture and query results.</text>
  <text x="126" y="338" fill="#f8fafc" font-family="monospace" font-size="30">## Findings</text>
  <text x="126" y="380" fill="#cbd5e1" font-family="monospace" font-size="24">- Primary records cluster around the same namespace and bucket.</text>
  <text x="126" y="418" fill="#cbd5e1" font-family="monospace" font-size="24">- Diagnostics show low retrieval ambiguity and a clean contract surface.</text>
  <text x="126" y="476" fill="#f8fafc" font-family="monospace" font-size="30">## Risks</text>
  <text x="126" y="518" fill="#cbd5e1" font-family="monospace" font-size="24">- Consensus quality depends on valid provider credentials and sanitized configuration.</text>
  <text x="126" y="576" fill="#f8fafc" font-family="monospace" font-size="30">## Recommended Next Steps</text>
  <text x="126" y="618" fill="#86efac" font-family="monospace" font-size="24">1. Keep secrets outside the repo and validate with `python scripts/validate_checkout.py`.</text>
</svg>
