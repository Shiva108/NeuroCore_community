<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">NeuroCore CLI capture and query demo</title>
  <desc id="desc">A terminal-style screenshot showing a capture command followed by a query command and JSON results.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect x="80" y="70" width="1120" height="580" rx="22" fill="#0b1020" stroke="#334155" stroke-width="2"/>
  <circle cx="130" cy="112" r="10" fill="#ef4444"/>
  <circle cx="160" cy="112" r="10" fill="#f59e0b"/>
  <circle cx="190" cy="112" r="10" fill="#22c55e"/>
  <text x="230" y="119" fill="#cbd5e1" font-family="monospace" font-size="24">neurocore-community / demo shell</text>
  <text x="120" y="180" fill="#93c5fd" font-family="monospace" font-size="27">$ neurocore capture --request-json '{"bucket":"research","content":"community repo note","content_format":"markdown","source_type":"note"}'</text>
  <text x="120" y="230" fill="#d1fae5" font-family="monospace" font-size="25">{</text>
  <text x="150" y="270" fill="#d1fae5" font-family="monospace" font-size="25">"status": "ok",</text>
  <text x="150" y="310" fill="#d1fae5" font-family="monospace" font-size="25">"record_id": "rec_01h...",</text>
  <text x="150" y="350" fill="#d1fae5" font-family="monospace" font-size="25">"namespace": "default",</text>
  <text x="150" y="390" fill="#d1fae5" font-family="monospace" font-size="25">"bucket": "research"</text>
  <text x="120" y="430" fill="#d1fae5" font-family="monospace" font-size="25">}</text>
  <text x="120" y="500" fill="#93c5fd" font-family="monospace" font-size="27">$ neurocore query --request-json '{"query_text":"community repo","namespace":"default","allowed_buckets":["research"],"sensitivity_ceiling":"standard"}'</text>
  <text x="120" y="550" fill="#f8fafc" font-family="monospace" font-size="25">{</text>
  <text x="150" y="590" fill="#f8fafc" font-family="monospace" font-size="25">"items": [{"record_id": "rec_01h...", "score": 1.0, "snippet": "community repo note"}],</text>
  <text x="150" y="630" fill="#f8fafc" font-family="monospace" font-size="25">"diagnostics": {"strategy": "lexical", "total_candidates": 1}</text>
  <text x="120" y="670" fill="#f8fafc" font-family="monospace" font-size="25">}</text>
</svg>
