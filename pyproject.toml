[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neurocore"
version = "0.1.0"
description = "Contract-first memory core for storing and retrieving policy-aware notes and documents."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136.0",
    "jsonschema>=4.0",
    "mcp>=1.0.0",
    "psycopg[binary]>=3.2",
    "uvicorn>=0.30",
]
keywords = ["memory", "retrieval", "fastapi", "mcp", "knowledge-base"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
dev = [
    "black>=24.0",
    "build>=1.2",
    "flake8>=7.0",
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
]
semantic = ["sentence-transformers>=3.0"]

[project.scripts]
neurocore = "neurocore.adapters.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
