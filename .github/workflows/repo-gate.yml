name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Check formatting
        run: black --check src tests scripts
      - name: Run lint
        run: flake8 src tests scripts
      - name: Run tests
        run: pytest
      - name: Validate OpenAPI snapshot
        run: python scripts/generate_openapi_snapshot.py --check
      - name: Validate repo contract
        run: python scripts/validate_checkout.py
